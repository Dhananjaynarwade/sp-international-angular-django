
<header class="navbar">

  <div class="nav-inner">

    <!-- LOGO -->
    <a
      class="brand"
      routerLink="/"
      (click)="scrollToSection('home')"
    >
      <span class="brand-mark">SP</span>

      <span class="brand-text">
        <strong>SP INTERNATIONAL</strong>
        <small>Global Trade & Sourcing</small>
      </span>
    </a>

    <!-- MOBILE MENU -->
    <button
      type="button"
      class="mobile-menu-btn"
      (click)="toggleMenu()"
      [attr.aria-expanded]="mobileMenuOpen"
      aria-controls="navbar-links"
      aria-label="Toggle navigation menu"
    >
      ☰
    </button>

  <!-- NAVIGATION LINKS -->
<nav
  id="navbar-links"
  class="nav-links"
  [class.mobile-open]="mobileMenuOpen"
>

  <a
    routerLink="/"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: true }"
    (click)="scrollToSection('home')">
    Home
  </a>

  <a
    routerLink="/about"
    routerLinkActive="active"
    (click)="scrollToSection('about')">
    About
  </a>

  <a
    routerLink="/products"
    routerLinkActive="active"
    (click)="scrollToSection('products')">
    Products
  </a>

  <a
    routerLink="/industries"
    routerLinkActive="active"
    (click)="scrollToSection('industries')">
    Industries
  </a>

  <a
    routerLink="/contact"
    routerLinkActive="active"
    (click)="scrollToSection('contact')">
    Contact
  </a>

</nav>

    <!-- QUOTE BUTTON -->
    <a
      class="nav-quote"
      routerLink="/contact"
      (click)="scrollToSection('contact')"
    >
      Request Quote
    </a>

  </div>

</header>
