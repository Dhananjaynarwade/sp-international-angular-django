<!-- SP INTERNATIONAL - COMING SOON -->

<section class="coming-soon">

  <div class="coming-soon-content">

    <div class="rocket-icon">🚀</div>

    <h1>Website Coming Soon</h1>

    <p>We are working on something special!</p>

    <!-- COUNTDOWN TIMER -->
    <div class="countdown">

      <div class="time-box">
        <strong>{{ days }}</strong>
        <span>Days</span>
      </div>

      <div class="time-box">
        <strong>{{ hours }}</strong>
        <span>Hours</span>
      </div>

      <div class="time-box">
        <strong>{{ minutes }}</strong>
        <span>Minutes</span>
      </div>

      <div class="time-box">
        <strong>{{ seconds }}</strong>
        <span>Seconds</span>
      </div>

    </div>

    <!-- NOTIFY BUTTON -->
    <button
      type="button"
      class="notify-btn"
      (click)="notifyMe()">
      NOTIFY ME
    </button>

  </div>

</section>
